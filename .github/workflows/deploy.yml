name: Deploy to Server

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Получить код
        uses: actions/checkout@v4

      - name: Проверка dbt моделей
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Установить dbt
        run: |
          pip install psycopg2-binary==2.9.9
          pip install dbt-postgres==1.8.0 --no-deps
          pip install dbt-adapters dbt-common dbt-core agate

      - name: dbt compile
        env:
          DBT_HOST: ${{ secrets.DBT_HOST }}
          DBT_USER: ${{ secrets.DBT_USER }}
          DBT_PASSWORD: ${{ secrets.DBT_PASSWORD }}
          DBT_DBNAME: ${{ secrets.DBT_DBNAME }}
        run: |
          cd dbt
          dbt compile --profiles-dir .

      - name: Deploy на сервер
        run: |
          sudo chmod -R 777 /data/de-portfolio
          cd /data/de-portfolio
          git reset --hard origin/main
          git pull origin main
          echo "Deploy completed!"
