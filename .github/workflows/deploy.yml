name: Deploy to Server

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Deploy на сервер
        run: |
          sudo chmod -R 777 /data/de-portfolio
          cd /data/de-portfolio
          git reset --hard origin/main
          git pull origin main
          echo "Deploy completed!"
